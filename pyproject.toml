[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SLiCAP"
authors = [
  { name="Anton Montagne", email="anton@montagne.nl" },
]
description = "SLiCAP: more than SYMBOLIC SPICE"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.4",
    "sympy>=1.13",
    "scipy>=1.14",
    "ply>=3.11",
    "matplotlib>=3.9.0",
    "svgelements>=1.9.6",
    "svglib>=1.5.1",
    "reportlab>=3.6",
    "pytexit>=0.4.0",
    "IPython>=8.19",
    "docutils>=0.18",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.2.0",
    "PySide6>=6.4",
    "requests>=2.25",
    ]
dynamic = ["version"]

# Optional: HDF5 result storage (sim.save/load/delete). Guarded imports with a
# "pip install h5py" message, so kept out of the base install.
[project.optional-dependencies]
hdf5 = ["h5py>=3.0"]

[project.scripts]
slicap = "SLiCAP.schematic.main:main"
slicap-schematics = "SLiCAP.schematic.main:main"

[project.urls]
Homepage = "https://slicap.github.io/SLiCAP_python/"
Issues = "https://github.com/SLiCAP/SLiCAP_python"

[tool.setuptools.dynamic]
version = {attr = "SLiCAP.__version__"}  # any module attribute compatible with ast.literal_eval

[tool.setuptools]
packages = ["SLiCAP", "SLiCAP.schematic"]

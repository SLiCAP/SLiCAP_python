[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SLiCAP"
authors = [
  { name="Anton Montagne", email="anton@montagne.nl" },
]
description = "SLiCAP: more than SYMBOLIC SPICE"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.4",
    "sympy>=1.13",
    "scipy>=1.14",
    "ply>=3.11",
    "matplotlib>=3.9.0",
    "svgelements>=1.9.6",
    # svglib before 2.1.0 split a font-family list at every space, so
    # "DejaVu Sans Mono, monospace" became four names. Each unknown name
    # ran fc-match, a console window on MS-Windows (Anton, 2026-11-22).
    # 2.3.0 is the version tested on Linux and MS-Windows. It needs
    # reportlab 4.4.3.
    "svglib>=2.3.0",
    "reportlab>=4.4.3",
    "IPython>=8.19",
    "docutils>=0.18",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-panels",
    "sphinx_book_theme",
    "sphinx_tabs",
    "sphinx_togglebutton",
    "sphinxcontrib-bibtex",
    "PySide6>=6.4",
    "requests>=2.25",
    # The tick program of the system-level simulator. numba also bounds
    # numpy: numpy 2.5 broke numba 0.66 on Windows (Anton, 2026-11-20),
    # and only with numba listed here does pip keep numpy in its range.
    "numba>=0.66",
    ]
dynamic = ["version"]

# Optional: HDF5 result storage (sim.save/load/delete). Guarded imports with a
# "pip install h5py" message, so kept out of the base install.
[project.optional-dependencies]
hdf5 = ["h5py>=3.0"]

[project.scripts]
slicap = "SLiCAP.schematic.main:main"
slicap-schematics = "SLiCAP.schematic.main:main"

[project.urls]
Homepage = "https://slicap.github.io/SLiCAP_python/"
Issues = "https://github.com/SLiCAP/SLiCAP_python"

[tool.setuptools.dynamic]
version = {attr = "SLiCAP.__version__"}  # any module attribute compatible with ast.literal_eval

[tool.setuptools.packages.find]
# Every package under SLiCAP/ with an __init__.py. An explicit list was
# REPLACED on 2026-11-16: a package listed here but absent from a checkout
# breaks the install, and discovery needs no edit when a subpackage is added.
include = ["SLiCAP*"]
